{% assign a = include.app %}{% assign id = a.slug %}
    <a class="app-card{% if a.kind == "watchface" %} app-card-face{% endif %}" href="{{ a.url }}" style="view-transition-name:app-card-{{ id }};view-transition-class:vt-card">
      <img src="{{ a.icon }}" alt="{{ a.name }}" loading="lazy" width="64" height="64" style="view-transition-name:app-icon-{{ id }};view-transition-class:vt-icon">
      <h3 style="view-transition-name:app-name-{{ id }};view-transition-class:vt-text">{{ a.name }}</h3>
      <p style="view-transition-name:app-desc-{{ id }};view-transition-class:vt-text">{{ a.tagline }}</p>
      <div class="badges"><span class="badge">Zepp</span>{% if a.garmin %}<span class="badge">Garmin</span>{% else %}<span class="badge soon">Garmin soon</span>{% endif %}{% if a.pro %}<span class="badge pro">Pro</span>{% endif %}</div>
    </a>
